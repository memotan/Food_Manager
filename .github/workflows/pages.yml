# GitHub Pages へのデプロイ
#
# Settings → Pages の Source が「GitHub Actions」のときに使う。
# main への push で index.html / manifest.json を含むリポジトリ全体を配信する。
# ビルド工程はない（静的ファイルをそのまま上げるだけ）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に走らないようにする。実行中のデプロイは中断しない
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # enablement: true は使わない。Pages サイトの作成には administration:write が
      # 必要で、既定の GITHUB_TOKEN には付与できないため必ず失敗する
      # （actions/configure-pages#40）。Pages は Settings → Pages で一度だけ
      # 手動で有効にすること。
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
